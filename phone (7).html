<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Phone</title>
<style>
:root{
  --page:#e7e7ec; --bezel:#1b1b1e; --ring:#3a3a3d; --shadow:#0003;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0e0e10;--bezel:#151517;--ring:#3a3a3c;--shadow:#000a;color-scheme:dark}}
:root[data-theme="dark"]{--page:#0e0e10;--bezel:#151517;--ring:#3a3a3c;--shadow:#000a;color-scheme:dark}

/* Tuning values live here so feel can be adjusted in one place */
.phone{--ease:cubic-bezier(.32,.72,0,1);--dur:.42s}

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--page);overflow:hidden;display:grid;place-items:center;
  font-family:-apple-system,"SF Pro Text","SF Pro Display",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;height:100dvh}
img{-webkit-user-drag:none}

.phone{position:relative;width:393px;height:852px;border-radius:58px;background:#000;overflow:hidden;
  box-shadow:0 0 0 3px var(--ring),0 0 0 11px var(--bezel),0 40px 90px var(--shadow);
  color:#fff;flex:none;transform-origin:center}
.full .phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none;transform:none!important}
.full #island{display:none}

/* ---------- wallpaper (replace with an image via CONFIG.wallpaper) ---------- */
.wp{position:absolute;inset:0;background:
  radial-gradient(120% 70% at 20% 8%,#f0a07a 0,#0000 60%),
  radial-gradient(110% 70% at 85% 35%,#6a5acd 0,#0000 62%),
  radial-gradient(120% 80% at 50% 105%,#12304f 0,#0000 70%),
  linear-gradient(#2a2347,#14233d);background-size:cover;background-position:center}

/* ---------- status bar ---------- */
#st{position:absolute;top:0;left:0;right:0;height:54px;z-index:50;pointer-events:none;
  display:flex;justify-content:space-between;align-items:center;
  padding:max(env(safe-area-inset-top,0px),6px) 34px 0 46px;font-weight:600;font-size:16px}
.full #st{height:calc(44px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 22px 0 26px}
#sr{display:flex;gap:6px;align-items:center}
#island{position:absolute;top:11px;left:50%;width:122px;height:36px;margin-left:-61px;border-radius:20px;background:#000;z-index:60}

/* ---------- home placeholder (revealed on unlock) ---------- */
#home{position:absolute;inset:0;opacity:0;transform:scale(.9);will-change:transform,opacity}
#hs{position:absolute;inset:0;padding:62px 20px 0;will-change:transform,opacity;touch-action:manipulation}
.full #hs{padding-top:calc(56px + env(safe-area-inset-top,0px))}
.wg{display:flex;gap:14px}
.w{flex:1;aspect-ratio:1;border-radius:24px;padding:14px;overflow:hidden;position:relative}
.wd{background:#1c1c1ed9;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;flex-direction:column}
.wd b{font-size:13px;font-weight:600;color:#ff6b5e}
.wd big{font-size:48px;font-weight:300;line-height:1.1;margin-top:2px}
.wd p{margin-top:auto;font-size:12.5px;color:#ffffff99}
.wph{background:linear-gradient(160deg,#f0a07a,#6a5acd 60%,#14233d)}
.wph::after{content:"Your photo";position:absolute;left:14px;bottom:12px;font-size:12px;color:#ffffffb3}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 0;margin-top:26px}
.ic{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;color:#fff;cursor:pointer;
  font-family:inherit;font-size:11.5px;font-weight:500;text-shadow:0 1px 4px #0005}
.ig{width:60px;height:60px;clip-path:url(#sq);display:grid;place-items:center;transition:filter .35s,transform .35s var(--ease)}
.ii{width:100%;height:100%;object-fit:cover;display:block}
.ic:active .ig{filter:brightness(.65);transform:scale(.93);transition:filter .08s,transform .1s ease-out}
#dock{position:absolute;left:14px;right:14px;bottom:calc(24px + env(safe-area-inset-bottom,0px));height:88px;border-radius:34px;
  background:#ffffff38;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;justify-content:space-around;align-items:center}
#app{position:absolute;inset:0;z-index:25;display:grid;place-items:center;text-align:center;overflow:hidden;
  visibility:hidden;pointer-events:none;will-change:transform,opacity;transform:scale(.1527)}
#app.on{pointer-events:auto}
#app h2{font-size:26px;font-weight:600;margin-top:16px}
#app p{margin-top:6px;font-size:14px;color:#ffffffb3}

/* ---------- lock screen ---------- */
#lock{position:absolute;inset:0;z-index:30;touch-action:none;will-change:transform;cursor:grab}
#lock:active{cursor:grabbing}
#lock .wp{filter:brightness(.92)}
#lock::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(#0000 55%,#0005)}
.lk{position:absolute;left:50%;transform:translateX(-50%);z-index:2}
#lockico{top:64px;width:20px;height:24px;opacity:.9}
#ld{top:96px;font-size:20px;font-weight:600;letter-spacing:.01em;color:#ffffffd9;white-space:nowrap;text-shadow:0 1px 6px #0003}
#lt{top:112px;font-size:96px;line-height:1.05;font-weight:600;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;white-space:nowrap;
  background:linear-gradient(#ffffffee,#ffffffa6);-webkit-background-clip:text;background-clip:text;color:transparent}
.fb{position:absolute;bottom:56px;width:50px;height:50px;border-radius:50%;z-index:2;border:0;color:#fff;
  background:#00000040;backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
  display:grid;place-items:center;cursor:pointer;transition:transform .2s var(--ease),background .2s}
.fb:active{transform:scale(.88);background:#00000066}
#fl{left:46px}#cam{right:46px}
#hint{bottom:30px;font-size:13px;color:#ffffffb3;white-space:nowrap;border:0;background:none;font-family:inherit;pointer-events:none;
  padding:8px 14px;animation:shimmer 2.6s ease-in-out infinite}
@keyframes shimmer{50%{opacity:.45}}
#credit{bottom:96px;font-size:10.5px;color:#ffffff66;letter-spacing:.02em;pointer-events:none;white-space:nowrap}

/* ---------- home bar ---------- */
#hb{position:absolute;left:0;right:0;bottom:0;height:44px;z-index:70;display:grid;place-items:end center;
  padding-bottom:8px;border:0;background:none;cursor:pointer}
#hb i{width:134px;height:5px;border-radius:3px;background:#fff;transition:opacity .3s}
#hb{touch-action:none}

/* ---------- passcode ---------- */
#pass{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding-bottom:64px;opacity:0;transform:scale(.9);pointer-events:none;will-change:transform,opacity}
#pass.on{pointer-events:auto}
#pass .wp{filter:blur(28px) brightness(.55) saturate(1.2);transform:scale(1.15)}
#pt{position:relative;font-size:19px;font-weight:500;margin-bottom:26px}
#dots{position:relative;display:flex;gap:22px;margin-bottom:54px}
#dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff;transition:background .12s}
#dots i.f{background:#fff}
#dots.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{15%{transform:translateX(-14px)}30%{transform:translateX(12px)}45%{transform:translateX(-10px)}60%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
#keys{position:relative;display:grid;grid-template-columns:repeat(3,78px);gap:14px 24px}
.k{width:78px;height:78px;border-radius:50%;border:0;color:#fff;background:#ffffff2e;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-family:inherit;cursor:pointer;transition:background .45s}
.k:active{background:#ffffff66;transition:none}
.k{position:relative}
.k::before{content:"";position:absolute;inset:-7px -11px}  /* hit area covers the gaps between keys */
button{touch-action:manipulation}
.k b{font-size:34px;font-weight:400;line-height:1}
.k small{font-size:10px;font-weight:600;letter-spacing:.16em;height:11px;margin-top:1px}
#act{position:absolute;right:30px;bottom:calc(52px + env(safe-area-inset-bottom,0px));border:0;background:none;color:#fff;
  font-family:inherit;font-size:17px;font-weight:500;cursor:pointer;padding:16px 20px}
@media (prefers-reduced-motion:reduce){#pass{filter:none!important}#dots.shake{animation:none}}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:reduce){
  .phone{--dur:.01s}#hint{animation:none}#home{filter:none!important}
}
#sp{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(24px + 88px + 16px + env(safe-area-inset-bottom,0px));
  display:flex;gap:6px;align-items:center;padding:7px 18px;border-radius:18px;background:#ffffff33;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-size:13px;font-weight:500;color:#ffffffe6;letter-spacing:.01em}
#emg{position:absolute;left:30px;bottom:calc(52px + env(safe-area-inset-bottom,0px));font-size:17px;font-weight:500;padding:16px 20px;pointer-events:none}
#dock{box-shadow:inset 0 .5px 0 #ffffff55}
/* ---------- Control Center ---------- */
#st{z-index:58}
.fb.on{background:#fff;color:#000}
#cch{position:absolute;top:0;right:0;width:38%;height:30px;z-index:52;touch-action:none}
.full #cch{height:calc(30px + env(safe-area-inset-top,0px))}
#cc{position:absolute;inset:0;z-index:55;visibility:hidden;pointer-events:none;touch-action:none;container-type:size}
#cc.on{pointer-events:auto}
#ccb{position:absolute;inset:0;opacity:0;background:#0000006e;backdrop-filter:blur(34px) saturate(1.4);-webkit-backdrop-filter:blur(34px) saturate(1.4)}
#ccp{position:absolute;left:24px;right:24px;top:calc(76px + env(safe-area-inset-top,0px));display:grid;grid-template-columns:repeat(4,1fr);
  grid-auto-rows:calc((100cqw - 84px) / 4);gap:12px;transform-origin:85% 0;opacity:0;will-change:transform,opacity}
.ct{background:#ffffff2e;border-radius:26px;display:grid;place-items:center;border:0;color:#fff;font-family:inherit;
  transition:transform .3s var(--ease),background .25s,color .25s}
.ct:active{transform:scale(.97);transition:transform .1s ease-out,background .25s,color .25s}
.net:active{transform:none}
.ct svg{fill:currentColor}
.net{grid-column:1/3;grid-row:1/3;grid-template:1fr 1fr/1fr 1fr;gap:8px;padding:12px;place-items:stretch}
.bt{border-radius:50%;background:#0000004d;border:0;color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .3s var(--ease),background .25s,color .25s}
.bt:active{transform:scale(.95);transition:transform .1s ease-out,background .25s,color .25s}
.ct.bt:active{transform:scale(.96)}
.bt.on{background:var(--c,#fff)}
#cct.on{color:#000}
.media{grid-column:3/5;grid-row:1/3;grid-template-rows:1fr auto;padding:14px;text-align:center}
.np{font-size:14px;font-weight:600;color:#ffffffb3;align-self:center}
.mc{display:flex;gap:22px;color:#ffffff59;padding-bottom:6px}
.foc{grid-column:1/3;grid-row:3;display:flex;gap:10px;align-items:center;justify-content:flex-start;padding:0 16px;font-size:15px;font-weight:600;cursor:pointer}
.fi{width:36px;height:36px;border-radius:50%;background:#ffffff2e;display:grid;place-items:center;flex:none;transition:background .3s}
.on .fi{background:#5e5ce6}
.sl{position:relative;grid-row:3/5;border-radius:26px;background:#ffffff2e;overflow:hidden;touch-action:none;transition:transform .3s var(--ease)}
.sl.act{transform:scale(1.04)}
.sl i{position:absolute;left:0;right:0;bottom:0;background:#fff}
.sl svg{position:absolute;left:50%;bottom:16px;margin-left:-12px;fill:#8e8e93}
#sb{grid-column:3}#sv{grid-column:4}
.rd{grid-row:5;border-radius:50%}
/* ---------- Notification Center ---------- */
#nch{position:absolute;top:0;left:0;width:34%;height:30px;z-index:52;touch-action:none}
.full #nch{height:calc(30px + env(safe-area-inset-top,0px))}
#nc{position:absolute;inset:0;z-index:54;visibility:hidden;pointer-events:none;touch-action:none;overflow:hidden;will-change:transform}
#nc.on{pointer-events:auto}
#nc .wp{filter:blur(28px) brightness(.5) saturate(1.2);transform:scale(1.15)}
#nd,#nt{position:absolute;left:0;right:0;text-align:center;white-space:nowrap}
#nd{top:calc(66px + env(safe-area-inset-top,0px));font-size:20px;font-weight:600;color:#ffffffd9}
#nt{top:calc(90px + env(safe-area-inset-top,0px));font-size:84px;line-height:1.05;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:#ffffffee}
#nlh{position:absolute;top:204px;left:28px;right:24px;display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600;color:#ffffffb3;transition:opacity .3s}
#nclr{border:0;background:#ffffff2e;color:#fff;font:inherit;font-size:13px;padding:5px 12px;border-radius:14px;cursor:pointer}
#nclr:active{background:#ffffff59}
#nl{position:absolute;top:240px;bottom:64px;left:14px;right:14px;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;scrollbar-width:none;-webkit-mask-image:linear-gradient(#0000,#000 14px);mask-image:linear-gradient(#0000,#000 14px);padding-top:6px}
#nl::-webkit-scrollbar{display:none}
.nw{margin-bottom:8px;overflow:hidden;border-radius:22px}
.nt{display:grid;grid-template-columns:38px 1fr;gap:12px;padding:12px 14px;background:#48484acc;border-radius:22px;will-change:transform,opacity;cursor:pointer}
.nt:active{background:#606063d9}
.nt .ni{width:38px;height:38px;align-self:start}
.nh{display:flex;justify-content:space-between;font-size:12.5px;color:#ffffffa6;letter-spacing:.02em;text-transform:uppercase;font-weight:500}
.nt b{display:block;font-size:15px;font-weight:600;margin-top:2px}
.nt p{font-size:14.5px;color:#ffffffd9;margin-top:1px;line-height:1.25}
#ne{position:absolute;bottom:76px;left:0;right:0;text-align:center;font-size:14px;color:#ffffff73;pointer-events:none;opacity:0;transition:opacity .3s}
#nc.empty #ne{opacity:1}#nc.empty #nlh{opacity:0;pointer-events:none}
/* ---------- App switcher ---------- */
#sw{position:absolute;inset:0;z-index:26;display:none;touch-action:none}
#swb{position:absolute;inset:0;background:#000000a6;opacity:0}
.sc{position:absolute;inset:0;will-change:transform,opacity;box-shadow:0 14px 44px rgb(0 0 0 / calc(.47 * var(--sh,1)));cursor:pointer}
.sv{position:absolute;inset:0;display:grid;place-items:center;text-align:center;overflow:hidden;border-radius:inherit}
.sv h2{font-size:26px;font-weight:600;margin-top:16px}
.sv p{margin-top:6px;font-size:14px;color:#ffffffb3;padding:0 30px}
.lb{position:absolute;left:0;right:0;bottom:100%;margin-bottom:calc(10px / var(--k,.6));display:flex;align-items:center;justify-content:center;
  gap:calc(8px / var(--k,.6));font-size:calc(15px / var(--k,.6));font-weight:600;color:#fff;opacity:var(--lo,0);pointer-events:none;white-space:nowrap}
.lb .ig{width:calc(28px / var(--k,.6));height:calc(28px / var(--k,.6))}
.lb svg{width:62%;height:62%}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><clipPath id="sq" clipPathUnits="objectBoundingBox"><path d="M1.0000 0.5000 L0.9996 0.6680 L0.9983 0.7214 L0.9961 0.7601 L0.9931 0.7912 L0.9892 0.8175 L0.9844 0.8405 L0.9787 0.8608 L0.9720 0.8789 L0.9644 0.8952 L0.9558 0.9100 L0.9461 0.9233 L0.9353 0.9353 L0.9233 0.9461 L0.9100 0.9558 L0.8952 0.9644 L0.8789 0.9720 L0.8608 0.9787 L0.8405 0.9844 L0.8175 0.9892 L0.7912 0.9931 L0.7601 0.9961 L0.7214 0.9983 L0.6680 0.9996 L0.5000 1.0000 L0.3320 0.9996 L0.2786 0.9983 L0.2399 0.9961 L0.2088 0.9931 L0.1825 0.9892 L0.1595 0.9844 L0.1392 0.9787 L0.1211 0.9720 L0.1048 0.9644 L0.0900 0.9558 L0.0767 0.9461 L0.0647 0.9353 L0.0539 0.9233 L0.0442 0.9100 L0.0356 0.8952 L0.0280 0.8789 L0.0213 0.8608 L0.0156 0.8405 L0.0108 0.8175 L0.0069 0.7912 L0.0039 0.7601 L0.0017 0.7214 L0.0004 0.6680 L0.0000 0.5000 L0.0004 0.3320 L0.0017 0.2786 L0.0039 0.2399 L0.0069 0.2088 L0.0108 0.1825 L0.0156 0.1595 L0.0213 0.1392 L0.0280 0.1211 L0.0356 0.1048 L0.0442 0.0900 L0.0539 0.0767 L0.0647 0.0647 L0.0767 0.0539 L0.0900 0.0442 L0.1048 0.0356 L0.1211 0.0280 L0.1392 0.0213 L0.1595 0.0156 L0.1825 0.0108 L0.2088 0.0069 L0.2399 0.0039 L0.2786 0.0017 L0.3320 0.0004 L0.5000 0.0000 L0.6680 0.0004 L0.7214 0.0017 L0.7601 0.0039 L0.7912 0.0069 L0.8175 0.0108 L0.8405 0.0156 L0.8608 0.0213 L0.8789 0.0280 L0.8952 0.0356 L0.9100 0.0442 L0.9233 0.0539 L0.9353 0.0647 L0.9461 0.0767 L0.9558 0.0900 L0.9644 0.1048 L0.9720 0.1211 L0.9787 0.1392 L0.9844 0.1595 L0.9892 0.1825 L0.9931 0.2088 L0.9961 0.2399 L0.9983 0.2786 L0.9996 0.3320z"/></clipPath></svg>
<div class="phone" id="phone">
  <div class="wp"></div>

  <div id="pass" aria-hidden="true" aria-label="Passcode">
    <div class="wp"></div>
    <div id="pt">Enter Passcode</div>
    <div id="dots" aria-hidden="true"></div>
    <div id="keys"></div>
    <span id="emg">Emergency</span>
    <button id="act">Cancel</button>
  </div>

  <div id="home" aria-hidden="true">
    <div id="hs">
      <div class="wg">
        <div class="w wd"><b id="wdw"></b><big id="wdn"></big><p>No events today</p></div>
        <div class="w wph"></div>
      </div>
      <div class="g" id="grid"></div>
      <div id="sp"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6"/></svg>Search</div>
      <div id="dock"></div>
    </div>
  </div>

  <div id="lock" aria-label="Lock screen">
    <div class="wp" id="lockwp"></div>
    <svg id="lockico" class="lk" viewBox="0 0 20 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <rect x="2" y="10" width="16" height="12" rx="3" fill="#fff" stroke="none"/><path d="M5.5 10V7a4.5 4.5 0 0 1 9 0v3"/>
    </svg>
    <div class="lk" id="ld"></div>
    <div class="lk" id="lt"></div>
    <div class="lk" id="credit"></div>
    <button class="fb" id="fl" aria-label="Flashlight"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7.5 2h9a1 1 0 0 1 1 1v2.2c0 .5-.2 1-.5 1.4L15 9.5V21a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 9 21V9.5L7 6.6c-.3-.4-.5-.9-.5-1.4V3a1 1 0 0 1 1-1zm1 2.4h7V3.5h-7zM12 12.2a1.4 1.4 0 0 0-1.4 1.4v1.5a1.4 1.4 0 0 0 2.8 0v-1.5a1.4 1.4 0 0 0-1.4-1.4z"/></svg></button>
    <button class="fb" id="cam" aria-label="Camera"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9.2 4h5.6c.5 0 1 .3 1.2.7l.9 1.6H19a2.5 2.5 0 0 1 2.5 2.5v9a2.5 2.5 0 0 1-2.5 2.5H5a2.5 2.5 0 0 1-2.5-2.5v-9A2.5 2.5 0 0 1 5 6.3h2.1L8 4.7c.2-.4.7-.7 1.2-.7zM12 9a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg></button>
    <button class="lk" id="hint">Swipe up to unlock</button>
  </div>

  <div id="app" aria-hidden="true"></div>
  <div id="sw" aria-hidden="true" aria-label="App Switcher"><div id="swb"></div></div>
  <div id="st" aria-hidden="true">
    <b id="sl"></b>
    <span id="sr">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" width="3" height="12" rx="1"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1.5 4.5a10 10 0 0 1 14 0"/><path d="M4.2 7.4a6 6 0 0 1 8.6 0"/><circle cx="8.5" cy="10.3" r=".9" fill="currentColor"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="19" height="9" rx="2" fill="currentColor"/><rect x="24" y="4" width="2" height="5" rx="1" fill="currentColor" opacity=".4"/></svg>

<script>
/* ---- CONFIG: everything you may want to change lives here ---- */
const CONFIG = {

const $ = id => document.getElementById(id);
const phone = $("phone"), lock = $("lock"), home = $("home"), pass = $("pass");

const buzz = p => { if (navigator.vibrate) try { navigator.vibrate(p); } catch (e) {} };

/* ---- clock ---- */
function tick() {

  const t = parts.filter(p => p.type === "hour" || p.type === "literal" || p.type === "minute").map(p => p.value).join("").trim();
  $("lt").textContent = t; $("sl").textContent = t;

}
tick();
setTimeout(function loop() { tick(); setTimeout(loop, 60000 - (Date.now() % 60000) + 50); }, 60000 - (Date.now() % 60000) + 50);

/* ---- spring engine: every moving layer is one value that a spring (or the finger) drives ----

   response = the spring's period in seconds (not a duration); damping 1 = no bounce. */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const Val = (v, apply, eps) => ({ v, vel: 0, apply, eps, raf: 0 });
const hold = o => { cancelAnimationFrame(o.raf); o.vel = 0; };
function go(o, tgt, { response = .4, damping = 1, velocity, done } = {}) {
  cancelAnimationFrame(o.raf);
  if (velocity != null) o.vel = velocity;
  if (reduce) { o.v = tgt; o.vel = 0; o.apply(tgt); done && done(); return; }
  const k = (6.2832 / response) ** 2, c = 2 * damping * Math.sqrt(k);
  let last = performance.now();
  const step = now => {

    const n = Math.max(1, Math.ceil(dt / .004)), h = dt / n;

    if (Math.abs(o.v - tgt) < o.eps && Math.abs(o.vel) < o.eps * 12) { o.v = tgt; o.vel = 0; o.apply(tgt); done && done(); return; }

const project = (v, r = .998) => v / 1000 * r / (1 - r);                 // where a flick at v px/s would come to rest (Apple's decay form)

const getS = () => parseFloat(phone.style.getPropertyValue("--s")) || 1;   // window scale, so the screen tracks the finger 1:1

const appEl = $("app"), hs = $("hs"), hb = $("hb");
let org = { x: 196, y: 426 }, orgIg = null;
const setOrg = id => { if (orgIg) orgIg.style.opacity = ""; orgIg = document.querySelector(`.ic[data-id='${id}'] .ig`); };      // centre of the icon the open app grows from
let H = 852, skipClick = false;
const noClick = () => { skipClick = true; setTimeout(() => skipClick = false, 80); };
const lockY = Val(0, y => { lock.style.transform = `translate3d(0,${Math.min(0, y)}px,0)`; lock.style.visibility = y <= -H + .5 ? "hidden" : "visible"; }, .05);
const passV = Val(0, p => { pass.style.opacity = p; pass.style.transform = `scale(${.94 + .06 * p})`; }, .001);
const homeV = Val(0, p => { home.style.opacity = p; home.style.transform = `scale(${1.1 - .1 * p})`; }, .001);
/* appP: 0 = app is an icon, 1 = full screen. The home screen is driven from the same number so the two always agree. */
const S0 = 60 / 393;     // the window starts exactly icon-sized

[lockY, passV, homeV, appP].forEach(o => o.apply(o.v));

/* swipe committed: the lock screen leaves with the finger's velocity and the passcode screen arrives */
function unlock(v = 0) {

/* ---- passcode keypad ---- */
const dots = $("dots"), act = $("act");

$("keys").innerHTML = [1,2,3,4,5,6,7,8,9,"",0,""].map(n => n === "" ? "<span></span>" :
  `<button class="k" data-n="${n}" aria-label="${n}"><b>${n}</b><small>${LET[n] || ""}</small></button>`).join("");

}

function press(n) {

}

act.addEventListener("click", e => { if (e.detail === 0) back(); });

/* ---- swipe up to unlock (lock screen or home bar): 1:1 tracking, rubber-band downward, momentum-projected release ---- */

});
$("hint").addEventListener("click", () => unlock());
/* ---- home screen: widgets, icon grid, dock. Icons load from icons/<id>.png; the drawn glyphs below are only a fallback. ---- */
const ICON = {
  messages: '<path d="M12 4C7 4 3 7.3 3 11.4c0 2.3 1.2 4.3 3.1 5.7-.1 1.3-.6 2.4-1.4 3.3 1.8-.1 3.2-.8 4.3-1.7.9.3 1.9.4 3 .4 5 0 9-3.3 9-7.7S17 4 12 4z" fill="#fff"/>',
  phone: '<path fill="#fff" d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/>',
  photos: '<circle cx="16.5" cy="8" r="2.4" fill="#fff"/><path d="M3 19l6-8 4 5 2.5-3L21 19z" fill="#fff"/>',
  notes: '<path d="M6 8h12M6 12h12M6 16h8" stroke="#6b5200" stroke-width="1.8" stroke-linecap="round" fill="none"/>',
  music: '<path d="M9 17.5V6.5l10-2v11" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="17.5" r="2.5" fill="#fff"/><circle cx="17" cy="15.5" r="2.5" fill="#fff"/>',
  camera: '<path fill="#fff" d="M9.2 4h5.6c.5 0 1 .3 1.2.7l.9 1.6H19a2.5 2.5 0 0 1 2.5 2.5v9a2.5 2.5 0 0 1-2.5 2.5H5a2.5 2.5 0 0 1-2.5-2.5v-9A2.5 2.5 0 0 1 5 6.3h2.1L8 4.7c.2-.4.7-.7 1.2-.7zM12 9a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/>',
  clock: '<circle cx="12" cy="12" r="8.5" fill="#fff"/><path d="M12 7v5l3.5 2" stroke="#111" stroke-width="1.8" stroke-linecap="round" fill="none"/>',
  settings: '<path d="M5 8h14M5 16h14" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="8" r="2.6" fill="#8e8e93" stroke="#fff" stroke-width="2"/><circle cx="15" cy="16" r="2.6" fill="#8e8e93" stroke="#fff" stroke-width="2"/>'
};
/* Edit this list to change the apps. dock:true puts an app in the dock. */
const APPS = [
  { id: "photos", img: "icons/photos.png", name: "Photos",   bg: ["#6ec8ff", "#4a6cf7"] },
  { id: "notes", img: "icons/notes.png", name: "Notes",    bg: ["#ffe27a", "#ffc83d"] },
  { id: "clock", img: "icons/clock.png", name: "Clock",    bg: ["#2c2c2e", "#000"] },
  { id: "settings", img: "icons/settings.png", name: "Settings", bg: ["#a1a1a6", "#636366"] },
  { id: "phone", img: "icons/phone.png", name: "Phone",    bg: ["#5fd68a", "#12a150"], dock: true },
  { id: "messages", img: "icons/messages.png", name: "Messages", bg: ["#6fe08a", "#19b94d"], dock: true },
  { id: "music", img: "icons/music.png", name: "Music",    bg: ["#ff6a8a", "#ff2d55"], dock: true },
  { id: "camera", img: "icons/camera.png", name: "Camera",   bg: ["#8e8e93", "#48484a"], dock: true }

const byId = Object.fromEntries(APPS.map(a => [a.id, a]));
function icFallback(img) {   // PNG missing: swap in the drawn glyph so the icon never disappears

  s.setAttribute("width", 30); s.setAttribute("height", 30); s.setAttribute("viewBox", "0 0 24 24");

$("grid").innerHTML = APPS.filter(a => !a.dock).map(iconBtn).join("");
$("dock").innerHTML = APPS.filter(a => a.dock).map(iconBtn).join("");
function wdate() {
  const d = new Date();
  $("wdw").textContent = new Intl.DateTimeFormat("en-US", { weekday: "long" }).format(d);
  $("wdn").textContent = d.getDate();
}
wdate();

/* open: the app grows out of its icon (transform-origin = the icon's centre). Close reverses the same path.
   Open and close are just springs on appP, so tapping again, or grabbing the home bar mid-flight, redirects from where it is. */
function openApp(btn) {
  if (view !== "home") return;
  const a = byId[btn.dataset.id], S = getS();
  if (appP.v < .02) {
    const pr = phone.getBoundingClientRect(), r = btn.querySelector(".ig").getBoundingClientRect();
    org = { x: (r.left + r.width / 2 - pr.left) / S, y: (r.top + r.height / 2 - pr.top) / S };
    appEl.style.background = `linear-gradient(${a.bg[0]},${a.bg[1]})`;
    appEl.innerHTML = `<div>${a.img ? `<img src="${a.img}" width="96" height="96" alt="" draggable="false" style="clip-path:url(#sq)" onerror="this.remove()">` : ""}<h2>${a.name}</h2><p>Coming in a later checkpoint. Swipe up from the bottom bar to go back.</p></div>`;
    appEl.dataset.id = a.id; setOrg(a.id);

    if (appP.v > .5) return;                 // another app is still mostly open: ignore

  }

function closeApp(v = 0) {
  if (view !== "app") return;
  view = "home"; appEl.classList.remove("on"); appEl.setAttribute("aria-hidden", "true");
  go(appP, 0, { response: .27, velocity: v || Math.min(appP.vel, -3) });

/* icons open on release, with a forgiving 14px slop so a light tap always counts */
let pd = null;
hs.addEventListener("pointerdown", e => { const b = e.target.closest(".ic"); pd = b ? { b, x: e.clientX, y: e.clientY } : null; });

  go(c.y, -H * 1.15, { response: .3, velocity: v, done: () => { leaving.splice(leaving.indexOf(c), 1); c.el.remove(); renderSw(); } });
  if (!run.length) { setTimeout(() => leaveSw(null), 120); return; }       // last app closed: home
  const st = STEP();
  run.forEach((k, j) => go(k.slot, j * st, { response: .4 }));
  go(scr, Math.max(0, Math.min(run.length - 1, Math.round(scr.v / st))) * st, { response: .4 });
}
swEl.addEventListener('pointerdown', e => {
  if (view !== 'switcher') return;
  swTouched = true;
  hold(scr); hist = []; track(e);
  g = { x: e.clientX / getS(), y: e.clientY / getS(), mode: 0, base: scr.v, by: 0, ox: 0, oy: 0, card: run.find(c => c.el === e.target.closest('.sc')), s: [{ t: e.timeStamp, x: e.clientX / getS(), y: e.clientY / getS() }], armed: false };
  if (g.card) { hold(g.card.y); g.by = g.card.y.v; }
  swEl.setPointerCapture(e.pointerId);
});
swEl.addEventListener('pointermove', e => {
  if (!g) return;
  track(e);
  const S = getS(), W = phone.offsetWidth, dx = e.clientX / S - g.x, dy = e.clientY / S - g.y;
  g.s.push({ t: e.timeStamp, x: e.clientX / S, y: e.clientY / S }); while (g.s.length > 2 && e.timeStamp - g.s[0].t > 500) g.s.shift();
  if (!g.mode) {      // decide the gesture from the first 8px: sideways scrolls, upward on a card quits it
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 8) return;
    g.mode = Math.abs(dx) > Math.abs(dy) ? 1 : dy < 0 ? (g.card ? 2 : 3) : 4; g.ox = dx; g.oy = dy;
    if (g.mode === 4) {      // pulling down: the card under the finger (or the centred one) grows back toward full screen
      if (hm.v < .95) g.mode = 3;
      else {
        g.pc = g.card || run[Math.max(0, Math.min(run.length - 1, Math.round(scr.v / STEP())))];
        if (!g.pc) g.mode = 3;
        else { hero = g.pc; hstart = { s: 1, tx: 0, ty: 0, r: 0, o: 1, cl: 0 }; g.pc.el.style.zIndex = 5; hold(g.pc.y); }
      }
    }
  }
  if (g.mode === 1) { const v = g.base - (dx - g.ox), max = (run.length - 1) * STEP(); set(scr, v < 0 ? -rubber(-v, W) : v > max ? max + rubber(v - max, W) : v); }
  else if (g.mode === 2) { const d = g.by + dy - g.oy; set(g.card.y, d < 0 ? d : rubber(d, H) * .3); }
  else if (g.mode === 4) {      // 1:1 with the finger and fully reversible: drag back up and it shrinks back into the row
    const t = clamp01((dy - g.oy) / (H * PULL)), te = Math.pow(t, EASE);
    g.t = t; set(hm, 1 - te);
    const armed = te > .4; if (armed !== g.armed) { g.armed = armed; buzz(4); }      // a tick when it crosses "this will open"
  }
});
const PULL = .29, EASE = 1.5;      // finger travel (fraction of screen height) for a full pull. growth = t^EASE: it takes real distance to get going, then needs less and less per pixel
function trailVy(S, now) { const n = S.length; let i = n - 1; while (i > 0 && now - S[i].t < 110) i--; return (S[n - 1].y - S[i].y) / Math.max(.06, (now - S[i].t) / 1000); }
function swUp(e) {
  if (!g) return;
  const q = g; g = null; const n = run.length, st = STEP();
  if (!q.mode) { leaveSw(q.card || null); return; }          // a tap
  if (q.mode === 1) {
    const vx = velx(), idx = Math.max(0, Math.min(n - 1, Math.round((scr.v + project(-vx)) / st)));
    go(scr, idx * st, { response: .42, velocity: -vx });
  } else if (q.mode === 4) {
    const S = getS(), now = e && e.timeStamp || performance.now();
    if (e && e.type === 'pointerup') q.s.push({ t: now, x: e.clientX / S, y: e.clientY / S });
    const slope = Math.max(.6, Math.min(2.5, EASE * Math.pow(q.t || 0, EASE - 1))), dmdt = -trailVy(q.s, now) * slope / (H * PULL), mm = hm.v + project(dmdt);       // where the pull is headed if you let go
    if (mm < .6) leaveSw(q.pc, dmdt);                                              // far enough or flicked down: open it
    else go(hm, 1, { response: .36, velocity: dmdt, done: () => { q.pc.el.style.zIndex = ''; } });   // changed your mind: back into the row
  } else if (q.mode === 2) {
    const vy = vel();
    if (q.card.y.v + project(vy) < -H * .2) quit(q.card, vy); else go(q.card.y, 0, { response: .38, velocity: vy });
  }
}
swEl.addEventListener('pointerup', swUp); swEl.addEventListener('pointercancel', swUp);
hb.addEventListener('pointerdown', e => { if (view === 'switcher') { hsw = e.clientY / getS(); hb.setPointerCapture(e.pointerId); } });
hb.addEventListener('pointerup', e => { if (hsw == null) return; const d = hsw - e.clientY / getS(); hsw = null; if (d > 20) { noClick(); leaveSw(null); } });
addEventListener('keydown', e => { if (e.key === 'Escape' && view === 'switcher') { e.stopImmediatePropagation(); leaveSw(null); } });
addEventListener("contextmenu", e => e.preventDefault());
addEventListener("keydown", e => {
  if (view === "lock" && (e.key === "ArrowUp" || e.key === "Enter")) unlock();
  else if (view === "pass") {
    if (/^\d$/.test(e.key)) press(e.key);
    else if (e.key === "Backspace") back();
    else if (e.key === "Escape") toLock();
  } else if (view === "home" && e.key === "Escape") relock();
  else if (view === "app" && e.key === "Escape") closeApp();
});

/* ---- fit the phone to the window (full-screen on small screens) ---- */
function fit() {
  const small = innerWidth <= 500;
  document.documentElement.classList.toggle("full", small);
  H = phone.offsetHeight; if (view !== "lock") set(lockY, -H); if (!ncOpen) set(nY, -H);
  if (small) { phone.style.transform = ""; phone.style.setProperty("--s", 1); return; }
  const s = Math.min(1, (innerHeight - 48) / 852, (innerWidth - 48) / 393);
  phone.style.setProperty("--s", s);
  phone.style.transform = `scale(${s})`;
}
fit(); addEventListener("resize", fit); addEventListener("orientationchange", fit);
</script>
